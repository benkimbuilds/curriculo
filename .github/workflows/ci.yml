name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: curriculo_test
          POSTGRES_USER: curriculo
          POSTGRES_PASSWORD: curriculo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curriculo -d curriculo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://curriculo:curriculo@localhost:5432/curriculo_test
      TEST_DATABASE_URL: postgresql://curriculo:curriculo@localhost:5432/curriculo_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      TRUSTED_ORIGINS: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SOCIAL_FEATURES_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:validate
      - run: pnpm content:manifest:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm test
      - name: Verify enabled community isolation
        run: pnpm exec vitest run src/modules/community/db-community.integration.test.ts
        env:
          SOCIAL_FEATURES_ENABLED: "true"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser flows
        run: |
          pnpm worker > /tmp/ruta-worker.log 2>&1 &
          pnpm test:e2e
      - name: Production burst smoke
        run: |
          pnpm start > /tmp/ruta-web.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/api/ready >/dev/null && break; sleep 1; done
          pnpm test:load
      - name: Container build and migration smoke
        run: |
          docker build -t ruta-curriculo:ci .
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_URL="$BETTER_AUTH_URL" \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e TRUSTED_ORIGINS="$TRUSTED_ORIGINS" \
            -e SMTP_HOST="$SMTP_HOST" -e SMTP_PORT="$SMTP_PORT" \
            -e SMTP_SECURE=false -e SOCIAL_FEATURES_ENABLED=false \
            ruta-curriculo:ci pnpm db:migrate
