services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curriculo
      POSTGRES_USER: curriculo
      POSTGRES_PASSWORD: curriculo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - curriculo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculo -d curriculo"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  curriculo_postgres:
